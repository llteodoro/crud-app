# CI workflow to build, test, and lint the CRUD app on push or pull request
name: CI Pipeline
on:
  push:
    branches: [main] # Trigger on pushes to main branch
  pull_request:
    branches: [main] # Trigger on PRs to main branch
jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Cache backend dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-backend-${{ hashFiles('backend/package-lock.json') }}
      - run: cd backend && npm ci
      - run: cd backend && npm test
      - run: cd backend && npm run lint
  frontend:
        name: Frontend CI
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
          - name: Set up Node.js
            uses: actions/setup-node@v3
            with:
              node-version: '18'
          - name: Cache frontend dependencies
            uses: actions/cache@v3
            with:
              path: ~/.npm
              key: ${{ runner.os }}-node-frontend-${{ hashFiles('frontend/package-lock.json') }}
          - run: cd frontend && npm ci
          - run: cd frontend && npm test
          - run: cd frontend && npm run lint